<!doctype html>
<meta charset="utf-8">
<title>ezyshare</title>
<link rel="stylesheet" href="sidepanel.css">
<header>
  <div class="brand">ezyshare</div>
  <div class="me"><span id="dot" class="dot"></span><span id="myname">connecting…</span></div>
</header>

<section id="offline" hidden>
  <p class="warn">Daemon not running.</p>
  <p class="hint">Start it, then hit refresh:</p>
  <code>node daemon/ezyshare.mjs</code>
  <p class="hint" id="errline"></p>
</section>

<section id="main" hidden>
  <p class="hint">Drag a link onto a name. Or click a card to send the current tab.</p>
  <ul id="peers"></ul>
  <p id="nopeers" class="empty" hidden>No one else online yet.<br>Same wifi, daemon running on both machines.</p>

  <h2>Received</h2>
  <ul id="inbox"></ul>
  <p id="noinbox" class="empty" hidden>Nothing yet.</p>
  <button id="clear" class="ghost">Clear received</button>
</section>

<footer><button id="refresh" class="ghost">Refresh</button></footer>
<script type="module" src="sidepanel.js"></script>
